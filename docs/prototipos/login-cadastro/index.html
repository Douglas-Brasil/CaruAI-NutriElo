<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login e Cadastro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      width: min(90vw, 420px);
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 28px 24px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      text-align: center;
    }
    .sub {
      color: #666;
      text-align: center;
      margin: 0 0 20px;
    }
    form {
      display: grid;
      gap: 10px;
    }
    label {
      font-weight: 600;
      margin-top: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #d5d9e0;
      border-radius: 8px;
      font-size: 1rem;
    }
    .main {
      margin-top: 14px;
      background: #3f63ff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 1rem;
      cursor: pointer;
    }
    .msg {
      min-height: 20px;
      margin-top: 12px;
      color: #c00;
      font-size: 0.9rem;
    }
    .switch {
      margin-top: 16px;
      text-align: center;
      color: #555;
    }
    .switch button {
      background: none;
      border: none;
      color: #3f63ff;
      cursor: pointer;
      font-weight: 700;
      padding: 0;
    }
    .hidden {
      display: none;
    }
    .welcome {
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">

    <!-- LOGIN -->
    <section id="login-view">
      <h1>Bem-vindo de volta</h1>
      <p class="sub">Entre na sua conta para continuar.</p>
      <form id="login-form" novalidate>
        <label for="login-email">E-mail</label>
        <input id="login-email" type="email" autocomplete="email" placeholder="voce@email.com">
        <label for="login-senha">Senha</label>
        <input id="login-senha" type="password" autocomplete="current-password" placeholder="••••••••">
        <button class="main" type="submit">Entrar</button>
      </form>
      <div class="msg" id="login-msg" role="alert"></div>
      <div class="switch">Não tem conta? <button type="button" data-go="signup">Cadastre-se</button></div>
    </section>

    <!-- CADASTRO -->
    <section id="signup-view" class="hidden">
      <h1>Criar conta</h1>
      <p class="sub">Preencha os dados abaixo.</p>
      <form id="signup-form" novalidate>
        <label for="signup-nome">Nome</label>
        <input id="signup-nome" type="text" autocomplete="name" placeholder="Seu nome">
        <label for="signup-email">E-mail</label>
        <input id="signup-email" type="email" autocomplete="email" placeholder="voce@email.com">
        <label for="signup-senha">Senha</label>
        <input id="signup-senha" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
        <label for="signup-confirma">Confirmar senha</label>
        <input id="signup-confirma" type="password" autocomplete="new-password" placeholder="Repita a senha">
        <button class="main" type="submit">Cadastrar</button>
      </form>
      <div class="msg" id="signup-msg" role="alert"></div>
      <div class="switch">Já tem conta? <button type="button" data-go="login">Entrar</button></div>
    </section>

    <!-- LOGADO -->
    <section id="welcome-view" class="welcome hidden">
      <h1 id="welcome-title">Olá!</h1>
      <p class="sub">Você entrou com sucesso.</p>
      <button class="main" id="logout-btn" type="button">Sair</button>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
